name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Strict Type-Check (BLOCKING)
        run: npx tsc -p tsconfig.app.json --noEmit --strict
      - name: RLS Validation Gate (BLOCKING — pre-prod)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Blocking gate: any P0 finding (missing hospital_id on PHI table)
        # exits non-zero and aborts the production deploy.
        run: npx tsx scripts/validate-rls.ts
      - name: Deploy to Production
        if: env.SUPABASE_PROJECT_ID != '' && env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          npx supabase link --project-ref $SUPABASE_PROJECT_ID
          npx supabase db push
      - name: Health Check
        if: env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          sleep 10
          curl -f "$HEALTHCHECK_URL" || exit 1
