name: Secret Scan

# S0-11 (SECF-19, SECF-20, SECF-21, OPS-16): fail any push or PR that adds a credential.
# Config: .gitleaks.toml. Runbook: docs/operations/SECRET_ROTATION_AND_HISTORY_PURGE.md
#
# - The "new-commits" job gates PRs and pushes. It scans only the commits being added,
#   so findings that already sit in history do not block unrelated work.
# - The "full-scan" job (weekly and manual) scans the working tree and the whole
#   history. It is expected to FAIL until the history purge in the runbook is done.
#   After the purge, a clean run is the S0-11 validation ("gitleaks run in CI is clean").
#
# gitleaks runs from its official container image, pinned to a release tag. The
# gitleaks GitHub Action needs a license key for organization-owned repos; the CLI
# image does not. Reports are written with --redact, so no secret value reaches the
# logs or the uploaded artifact.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.21.2

jobs:
  new-commits:
    name: gitleaks (new commits)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            opts="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            opts="${PUSH_BEFORE}..${SHA}"
          else
            # New branch or force-push without a usable "before": scan the pushed head commit.
            opts="-1 ${SHA}"
          fi
          echo "log_opts=${opts}" >> "$GITHUB_OUTPUT"
          echo "Scanning git log ${opts}"

      - name: Run gitleaks on the new commits
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$GITLEAKS_IMAGE" git /repo \
              --config /repo/.gitleaks.toml \
              --log-opts="$LOG_OPTS" \
              --redact --no-banner --verbose \
              --exit-code 1 \
              --report-format json --report-path /repo/gitleaks-report-commits.json

      - name: Upload redacted report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-commits
          path: gitleaks-report-commits.json
          retention-days: 7

  full-scan:
    name: gitleaks (tree + full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree
        id: tree
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$GITLEAKS_IMAGE" dir /repo \
              --config /repo/.gitleaks.toml \
              --redact --no-banner \
              --exit-code 1 \
              --report-format json --report-path /repo/gitleaks-report-tree.json

      - name: Scan full history (all refs)
        id: history
        continue-on-error: true
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$GITLEAKS_IMAGE" git /repo \
              --config /repo/.gitleaks.toml \
              --log-opts="--all" \
              --redact --no-banner \
              --exit-code 1 \
              --report-format json --report-path /repo/gitleaks-report-history.json

      - name: Summarize (rule and file only)
        if: always()
        run: |
          for f in gitleaks-report-tree.json gitleaks-report-history.json; do
            [ -f "$f" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "\(.RuleID)\t\(.File)\t\(.Commit[0:7] // "")"' "$f" | sort | uniq -c | sort -rn \
              | head -100 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Upload redacted reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-reports-full
          path: gitleaks-report-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if anything was found
        if: steps.tree.outcome == 'failure' || steps.history.outcome == 'failure'
        run: |
          echo "gitleaks found secrets (tree: ${{ steps.tree.outcome }}, history: ${{ steps.history.outcome }})."
          echo "Rotate first, then purge. See docs/operations/SECRET_ROTATION_AND_HISTORY_PURGE.md."
          exit 1
